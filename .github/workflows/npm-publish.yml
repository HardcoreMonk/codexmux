name: Publish npm package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag and default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Tagged commit $GITHUB_SHA is not on origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - name: Verify trusted publishing toolchain
        run: |
          node --version
          NPM_VERSION=$(npm --version)
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "$NPM_VERSION"
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm smoke:npm-package

      - name: Check existing npm version
        id: registry
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if PUBLISHED_RESULT=$(npm view "codexmux@$PACKAGE_VERSION" gitHead --json 2>/dev/null); then
            PUBLISHED_GIT_HEAD=$(node -p "JSON.parse(process.argv[1]) || ''" "$PUBLISHED_RESULT")
            if [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
              echo "codexmux@$PACKAGE_VERSION already exists from a different commit" >&2
              exit 1
            fi
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.publish == 'true'
        run: npm publish --access public
